<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tableau de Produits</title>
  <link rel="stylesheet" href="style4.css">
</head>
<body>

  <h2>Tableau des Produits</h2>

  <table class="produits">
    <thead>
      <tr>
        <th>Produit</th>
        <th>Prix</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Stylo</td>
        <td>1,50 €</td>
        <td>120</td>
      </tr>
      <tr>
        <td>Cahier</td>
        <td>3,00 €</td>
        <td>80</td>
      </tr>
      <tr>
        <td>Clé USB</td>
        <td>10,00 €</td>
        <td>35</td>
      </tr>
      <tr>
        <td>Souris</td>
        <td>15,00 €</td>
        <td>20</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
